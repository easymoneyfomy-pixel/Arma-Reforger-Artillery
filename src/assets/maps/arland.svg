<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" shape-rendering="geometricPrecision">
  <title>Arland · 4.1 km · Tactical reference</title>
  <defs>
    <radialGradient id="ocean" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0e2a3a"/>
      <stop offset="100%" stop-color="#06121b"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f5a36"/>
      <stop offset="100%" stop-color="#384528"/>
    </linearGradient>
    <linearGradient id="beach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdaa6b"/>
      <stop offset="100%" stop-color="#8a7a44"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f6e3f"/>
      <stop offset="100%" stop-color="#4d4b29"/>
    </linearGradient>
    <pattern id="forest" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#2f4022" fill-opacity="0.9"/>
      <circle cx="3" cy="3" r="1.4" fill="#1f2c14"/>
      <circle cx="10" cy="7" r="1.4" fill="#1f2c14"/>
      <circle cx="5" cy="11" r="1.4" fill="#1f2c14"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="url(#ocean)"/>

  <!-- coastline halo (sand) -->
  <path d="M 250 180
           C 180 240, 150 360, 180 470
           C 150 580, 200 720, 290 800
           C 380 870, 540 880, 660 830
           C 780 780, 850 670, 830 540
           C 870 430, 840 310, 740 240
           C 640 170, 480 150, 380 170
           C 330 160, 280 170, 250 180 Z"
        fill="url(#beach)"/>

  <!-- main land -->
  <path d="M 280 220
           C 220 280, 190 380, 220 470
           C 200 580, 240 700, 310 770
           C 400 830, 530 840, 640 800
           C 740 760, 800 660, 790 550
           C 820 450, 790 340, 720 290
           C 630 220, 490 210, 410 220
           C 360 215, 320 215, 280 220 Z"
        fill="url(#land)" stroke="#6e7a4f" stroke-width="1.4"/>

  <!-- ridgelines -->
  <path d="M 340 340 C 430 360, 530 350, 620 380" fill="none" stroke="#7c7a4a" stroke-opacity="0.5" stroke-width="1"/>
  <path d="M 360 460 C 460 480, 560 470, 660 500" fill="none" stroke="#7c7a4a" stroke-opacity="0.45" stroke-width="1"/>
  <path d="M 400 600 C 500 620, 600 610, 680 630" fill="none" stroke="#7c7a4a" stroke-opacity="0.4" stroke-width="1"/>

  <!-- highland -->
  <ellipse cx="480" cy="430" rx="100" ry="70" fill="url(#hill)" fill-opacity="0.55"/>
  <ellipse cx="650" cy="600" rx="70" ry="50" fill="url(#hill)" fill-opacity="0.45"/>

  <!-- forests -->
  <path d="M 320 300 L 460 280 L 500 380 L 380 410 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 540 320 L 700 320 L 720 420 L 580 430 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 260 500 L 380 510 L 400 620 L 280 640 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 560 530 L 720 540 L 730 660 L 590 680 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 400 700 L 560 700 L 580 780 L 430 790 Z" fill="url(#forest)" fill-opacity="0.7"/>

  <!-- pond -->
  <ellipse cx="500" cy="540" rx="22" ry="14" fill="#1a3a4a" stroke="#3a6080" stroke-width="0.5"/>
  <!-- river -->
  <path d="M 500 540 C 470 590, 440 660, 400 740" fill="none" stroke="#3a6080" stroke-width="1.6" stroke-linecap="round"/>

  <!-- training airstrip (small) -->
  <g transform="translate(560 460) rotate(20)">
    <rect x="-45" y="-3.5" width="90" height="7" fill="#2a2a2a" stroke="#a3a098" stroke-width="0.4"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#d6ff3a" stroke-width="0.4" stroke-dasharray="3 2"/>
  </g>

  <!-- roads -->
  <g fill="none" stroke="#c9b56a" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M 280 360 L 380 360 L 480 380 L 600 380 L 700 400"/>
    <path d="M 280 360 L 300 480 L 340 600 L 410 720 L 540 760 L 660 720 L 700 600 L 700 480 L 700 400"/>
    <path d="M 480 380 L 500 480 L 510 600 L 540 760"/>
    <path d="M 410 720 L 480 660 L 540 600"/>
  </g>
  <!-- trails -->
  <g fill="none" stroke="#8e7a3c" stroke-width="0.6" stroke-dasharray="2 2" stroke-opacity="0.8">
    <path d="M 340 460 L 420 500 L 500 530"/>
    <path d="M 580 500 L 640 560 L 700 600"/>
  </g>

  <!-- towns -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#f1e7b6">
    <g><circle cx="280" cy="360" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.7"/><text x="288" y="357">Roseau</text></g>
    <g><circle cx="480" cy="380" r="4" fill="#d6ff3a" stroke="#000" stroke-width="0.8"/><text x="488" y="377">Castel</text></g>
    <g><circle cx="700" cy="400" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.7"/><text x="708" y="397">Tyrone</text></g>
    <g><circle cx="540" cy="760" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.7"/><text x="548" y="757">Binic</text></g>
    <g><circle cx="340" cy="600" r="3" fill="#d6ff3a" stroke="#000" stroke-width="0.6"/><text x="348" y="597">Tanoa</text></g>
    <g><circle cx="660" cy="600" r="3" fill="#d6ff3a" stroke="#000" stroke-width="0.6"/><text x="668" y="597">Tisy</text></g>
  </g>

  <!-- scale bar (1 km on a 4 km island = 244 SVG units roughly; we draw 244 px) -->
  <g transform="translate(40 940)" font-family="ui-monospace, monospace" font-size="11" fill="#d6ff3a">
    <rect x="0" y="0" width="244" height="6" fill="#d6ff3a" fill-opacity="0.85"/>
    <rect x="0" y="0" width="122" height="6" fill="#06121b"/>
    <text x="0" y="22">0</text>
    <text x="115" y="22">500</text>
    <text x="234" y="22">1 km</text>
  </g>

  <g transform="translate(820 30)" font-family="ui-monospace, monospace" fill="#d6ff3a">
    <rect x="-10" y="-18" width="170" height="38" fill="#06121b" fill-opacity="0.7" stroke="#d6ff3a" stroke-opacity="0.4"/>
    <text x="0" y="0" font-size="14" letter-spacing="2">ARLAND</text>
    <text x="0" y="14" font-size="9" fill="#a8b07a" letter-spacing="1">4.1 KM · TRAINING ISLAND</text>
  </g>
</svg>
