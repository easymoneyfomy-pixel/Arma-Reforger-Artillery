<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" shape-rendering="geometricPrecision">
  <title>Everon · 12.8 km · Tactical reference</title>
  <defs>
    <!-- ocean -->
    <radialGradient id="ocean" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0e2a3a"/>
      <stop offset="100%" stop-color="#06121b"/>
    </radialGradient>
    <!-- land -->
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d5a36"/>
      <stop offset="100%" stop-color="#3a4628"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b6a3d"/>
      <stop offset="100%" stop-color="#4d4b29"/>
    </linearGradient>
    <pattern id="forest" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#2f4022" fill-opacity="0.9"/>
      <circle cx="3" cy="3" r="1.4" fill="#1f2c14"/>
      <circle cx="10" cy="7" r="1.4" fill="#1f2c14"/>
      <circle cx="5" cy="11" r="1.4" fill="#1f2c14"/>
    </pattern>
  </defs>

  <!-- water -->
  <rect width="1000" height="1000" fill="url(#ocean)"/>

  <!-- main island silhouette (irregular shape) -->
  <path d="M 130 120
           C 90 200, 80 320, 130 400
           C 110 480, 130 580, 180 660
           C 160 740, 200 840, 290 870
           C 360 900, 460 880, 540 860
           C 620 880, 720 870, 790 820
           C 870 780, 900 700, 880 600
           C 920 510, 900 410, 850 350
           C 870 260, 830 170, 740 140
           C 640 100, 520 130, 430 140
           C 340 110, 220 100, 130 120 Z"
        fill="url(#land)" stroke="#6e7a4f" stroke-width="1.5"/>

  <!-- ridgelines / hill shading -->
  <path d="M 220 200 C 280 220, 360 210, 430 240 S 540 270, 600 250" fill="none" stroke="#7c7a4a" stroke-opacity="0.55" stroke-width="1"/>
  <path d="M 200 260 C 280 280, 360 260, 460 300 S 580 320, 660 290" fill="none" stroke="#7c7a4a" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M 300 350 C 380 370, 460 360, 540 400" fill="none" stroke="#7c7a4a" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M 600 500 C 680 530, 740 520, 800 560" fill="none" stroke="#7c7a4a" stroke-opacity="0.4" stroke-width="1"/>

  <!-- highland masses -->
  <ellipse cx="290" cy="250" rx="80" ry="55" fill="url(#hill)" fill-opacity="0.55"/>
  <ellipse cx="700" cy="280" rx="70" ry="50" fill="url(#hill)" fill-opacity="0.5"/>
  <ellipse cx="420" cy="480" rx="90" ry="65" fill="url(#hill)" fill-opacity="0.45"/>
  <ellipse cx="730" cy="640" rx="60" ry="45" fill="url(#hill)" fill-opacity="0.45"/>

  <!-- forest masses -->
  <path d="M 350 350 L 480 320 L 520 420 L 460 470 L 360 460 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 600 380 L 760 360 L 800 460 L 700 500 L 620 470 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 230 540 L 380 530 L 410 640 L 290 670 L 220 620 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 500 620 L 660 600 L 700 700 L 590 740 L 510 700 Z" fill="url(#forest)" fill-opacity="0.75"/>
  <path d="M 740 700 L 830 690 L 850 770 L 770 790 Z" fill="url(#forest)" fill-opacity="0.7"/>

  <!-- inland lake -->
  <ellipse cx="500" cy="540" rx="38" ry="22" fill="#1a3a4a" stroke="#3a6080" stroke-width="0.6"/>
  <ellipse cx="350" cy="720" rx="22" ry="12" fill="#1a3a4a" stroke="#3a6080" stroke-width="0.6"/>

  <!-- rivers -->
  <path d="M 500 540 C 480 580, 460 620, 400 680 S 320 720, 290 760" fill="none" stroke="#3a6080" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 700 280 C 730 350, 760 430, 780 520 S 800 640, 800 720" fill="none" stroke="#3a6080" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- airfield (north - Montignac region) -->
  <g transform="translate(440 200) rotate(28)">
    <rect x="-65" y="-5" width="130" height="10" fill="#2a2a2a" stroke="#a3a098" stroke-width="0.4"/>
    <line x1="-58" y1="0" x2="58" y2="0" stroke="#d6ff3a" stroke-width="0.4" stroke-dasharray="3 2"/>
  </g>
  <!-- airfield (east - Saint-Phillipe) -->
  <g transform="translate(740 470) rotate(-15)">
    <rect x="-55" y="-4" width="110" height="8" fill="#2a2a2a" stroke="#a3a098" stroke-width="0.4"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#d6ff3a" stroke-width="0.4" stroke-dasharray="3 2"/>
  </g>

  <!-- road network -->
  <g fill="none" stroke="#c9b56a" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75">
    <path d="M 200 320 L 290 280 L 380 270 L 470 240 L 560 260 L 660 290 L 760 320"/>
    <path d="M 200 320 L 220 420 L 260 520 L 300 620 L 360 720 L 460 780 L 580 800 L 700 770 L 800 700"/>
    <path d="M 470 240 L 500 360 L 510 480 L 520 600 L 540 720 L 580 800"/>
    <path d="M 700 290 L 720 400 L 740 510 L 760 620 L 760 720"/>
    <path d="M 290 280 L 320 380 L 360 460 L 410 520"/>
    <path d="M 410 520 L 510 480"/>
    <path d="M 510 480 L 620 470"/>
    <path d="M 620 470 L 720 510"/>
  </g>
  <!-- secondary trails -->
  <g fill="none" stroke="#8e7a3c" stroke-width="0.6" stroke-dasharray="2 2" stroke-opacity="0.8">
    <path d="M 360 270 L 380 360 L 420 440"/>
    <path d="M 590 260 L 620 360 L 660 430"/>
    <path d="M 500 360 L 580 380"/>
    <path d="M 510 600 L 600 620"/>
    <path d="M 360 720 L 400 660"/>
  </g>

  <!-- town markers + labels -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#f1e7b6">
    <g><circle cx="470" cy="240" r="4" fill="#d6ff3a" stroke="#000" stroke-width="0.8"/><text x="478" y="237">Montignac</text></g>
    <g><circle cx="290" cy="280" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.8"/><text x="298" y="277">Le Moule</text></g>
    <g><circle cx="660" cy="290" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.8"/><text x="668" y="287">Lamentin</text></g>
    <g><circle cx="200" cy="420" r="3" fill="#d6ff3a" stroke="#000" stroke-width="0.7"/><text x="208" y="417">Provins</text></g>
    <g><circle cx="500" cy="480" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.8"/><text x="508" y="477">Morton</text></g>
    <g><circle cx="740" cy="470" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.8"/><text x="748" y="467">Saint-Phillipe</text></g>
    <g><circle cx="540" cy="720" r="3.5" fill="#d6ff3a" stroke="#000" stroke-width="0.8"/><text x="548" y="717">Levie</text></g>
    <g><circle cx="700" cy="770" r="3" fill="#d6ff3a" stroke="#000" stroke-width="0.7"/><text x="708" y="767">Larche</text></g>
    <g><circle cx="360" cy="720" r="3" fill="#d6ff3a" stroke="#000" stroke-width="0.7"/><text x="368" y="717">Cancon</text></g>
    <g><circle cx="290" cy="620" r="3" fill="#d6ff3a" stroke="#000" stroke-width="0.7"/><text x="298" y="617">Houdan</text></g>
  </g>

  <!-- scale bar (1 km) -->
  <g transform="translate(40 940)" font-family="ui-monospace, monospace" font-size="11" fill="#d6ff3a">
    <rect x="0" y="0" width="78" height="6" fill="#d6ff3a" fill-opacity="0.85"/>
    <rect x="0" y="0" width="39" height="6" fill="#06121b"/>
    <text x="0" y="22">0</text>
    <text x="33" y="22">500</text>
    <text x="74" y="22">1 km</text>
  </g>

  <!-- title block -->
  <g transform="translate(820 30)" font-family="ui-monospace, monospace" fill="#d6ff3a">
    <rect x="-10" y="-18" width="170" height="38" fill="#06121b" fill-opacity="0.7" stroke="#d6ff3a" stroke-opacity="0.4"/>
    <text x="0" y="0" font-size="14" letter-spacing="2">EVERON</text>
    <text x="0" y="14" font-size="9" fill="#a8b07a" letter-spacing="1">12.8 KM · COLD WAR</text>
  </g>
</svg>
